en:
  - "Multilingual open science has to rely on machine translation (MT), which can only be trusted if its outputs are evaluated. A scientific article is a long document whose coherence and cohesion, including terminological consistency, span many sentences. Errors in coherence or cohesion often cannot be seen within one sentence, yet the metrics in use were designed to score single sentences. Where the English text repeats a term, a French translation may legitimately vary it. Terminology metrics, which count glossary matches or identical renderings, penalise this variation."
  - "We test the metrics used to evaluate translated scientific documents, mainly from English to French, and build a terminology metric. The first research question (RQ1) asks whether the metrics currently applied to document-level translation are sensitive to document-level phenomena. The second (RQ2) asks how the terminology of a translated document should be evaluated when consistency and legitimate variation coexist, that is, how an automatic metric can tell a terminological error from a motivated variation."
  - "As human scores for whole documents are scarce, we sought to answer RQ1 with MetaDocEval, a framework that introduces controlled errors of coherence and cohesion into MT outputs and checks whether a metric prefers the original. We tested eight widely used metrics on passages of up to nine sentences from general-domain texts translated into French, Spanish, and German. None of them captures these errors: more context gives them, at best, a signal too weak for practical use. Those that rely on a human reference alone detect them only by penalising a departure from it. For the metrics, types of errors, languages, and domain we tested, our answer to RQ1 is negative. We release the test set."
  - "We sought to answer RQ2 in two steps, first by studying what count-based evaluation captures on scientific translations. Our pipeline finds glossary terms and their unlisted variants, such as acronyms, and aligns each occurrence with its translation. We compared a human reference with four large language models (LLMs) of medium size, prompted with and without the glossary terms, on articles and talk transcripts in natural language processing. The reference varies more than the systems on the articles, where a third of the concepts have more distinct forms in it than in the source, and less on the transcripts, while the systems vary alike on both. Two of the three consistency measures we applied penalise the reference where it varies most. Adding the glossary terms raises accuracy and consistency but, on the articles, suppresses the variation the reference displays. Counting cannot tell an error from a legitimate variation."
  - "We then introduced TermJudge, which judges, with a bilingual glossary, whether each translated term is acceptable in its document. For each term in a document, it sets an expected translation, from the glossary or else the system's most frequent one, validated by an LLM. Each occurrence that differs from the expected translation is examined by an LLM error judge and, if correct, by an LLM consistency judge, which decides whether the variation is legitimate. On Earth-science articles annotated by experts, the error judge detects mistranslated terms reliably, and the consistency judge agrees less, as the annotators record variation without judging it. On BioMQM-Terms, a public benchmark we built from biomedical translations annotated for errors by linguists, TermJudge ranks first ahead of ten comparison metrics. Applied to the first step, it shows that the glossary terms help every system by removing more errors than legitimate variation. The cost is a few more cases where a term and its acronym, for instance, share one translation. Our answer to RQ2 is this approach."
  - "Our results show that we need metrics able to evaluate at the document level and to judge the translation of terms rather than match it against a fixed form."
